  <!-- 台面 -->
  <ellipse cx="350" cy="100" rx="290" ry="42" fill="#FFFFFF" stroke="#4A3B36" stroke-width="7"/>
  <ellipse cx="350" cy="100" rx="246" ry="30" fill="none" stroke="#F3CBD9" stroke-width="4"/>
