<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- 占位礼物盒：主页中央的可点击礼物 -->
  <!-- 地面轻阴影 -->
  <ellipse cx="120" cy="216" rx="78" ry="12" fill="#EBD3BF" opacity="0.7"/>
  <!-- 盒身 -->
  <rect x="50" y="106" width="140" height="102" rx="14" fill="#FFB3C7" stroke="#4A3B36" stroke-width="6"/>
  <!-- 盒盖 -->
  <rect x="40" y="72" width="160" height="42" rx="13" fill="#FF8FAB" stroke="#4A3B36" stroke-width="6"/>
  <!-- 竖缎带 -->
  <rect x="105" y="72" width="30" height="136" fill="#FFE9F0" stroke="#4A3B36" stroke-width="5"/>
  <!-- 蝴蝶结 -->
  <ellipse cx="94" cy="56" rx="24" ry="14" fill="#FF8FAB" stroke="#4A3B36" stroke-width="5" transform="rotate(-20 94 56)"/>
  <ellipse cx="146" cy="56" rx="24" ry="14" fill="#FF8FAB" stroke="#4A3B36" stroke-width="5" transform="rotate(20 146 56)"/>
  <circle cx="120" cy="60" r="11" fill="#FF8FAB" stroke="#4A3B36" stroke-width="5"/>
  <!-- 盒身小圆点 -->
  <circle cx="80" cy="150" r="6" fill="#FFE9F0"/>
  <circle cx="162" cy="180" r="6" fill="#FFE9F0"/>
  <circle cx="88" cy="186" r="5" fill="#FFE9F0"/>
</svg>
